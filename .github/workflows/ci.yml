name: Lint Files

# This workflow lints the nextapp directory
# And will trigger on push to *any* branch except main
on:
  push:
    branches-ignore:
      - main

jobs:
  lint-app:
    name: Lint Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24.11.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0

      - name: Install Dependencies and Lint
        run: |
          cd nextapp
          npm ci
          npm run verify

  test-app:
    name: Unit Tests
    needs: lint-app
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Use NodeJS v24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: v24.11.0
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: |
          cd nextapp
          npm ci

      - name: Test
        run: |
          cd nextapp
          npm test
